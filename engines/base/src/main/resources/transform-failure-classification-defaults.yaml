---
# The shipped defaults for TransformExceptionClassifier: the exception names and message
# fragments that mean "this document cannot be transformed" rather than "this engine is
# unwell", and the infrastructure names and fragments that override them.
#
# This file is data, not configuration. It is read once from the classpath and is the only
# place the defaults are written down. It is NOT loaded as a Spring property source, so
# editing it here changes what the engine ships with, not what a deployment runs: the same
# keys under transform.failure.classification in application.yaml, an engine's
# application-default.yaml or an external file replace what is below, and entries under
# transform.failure.classification.contributions extend it. The effective lists are logged
# at startup.
#
# Because the keys are the property keys, a copy of this file is itself a valid external
# configuration file: copy it out of the jar, edit it, and mount it with
# SPRING_CONFIG_ADDITIONAL_LOCATION to replace the defaults at runtime.
#
# Everything here is matched by NAME, never by type, because engines/base must not depend on
# Tika, PDFBox or POI. Simple names, fully qualified names and superclass names all match, so
# an engine that shades or relocates a library still works.
#
# Anything not listed stays 500 and is still retried. That asymmetry is the whole design: a
# content failure reported as an outage only costs retries, while an outage reported as a
# content failure drops a transform a retry would have fixed. When in doubt, leave it out.

transform:
  failure:
    classification:

      # Exception class names that only ever mean the supplied document could not be parsed.
      class-names:
        # java.util.zip - a corrupt OOXML/ODF file is a corrupt zip
        - ZipException
        # java.io / java.nio.charset - truncated or undecodable content
        #
        # UnsupportedEncodingException is deliberately NOT listed. It means the requested
        # *charset name* is not installed in the JVM, and that name arrives in the caller's
        # targetEncoding option, not in the file. Listing it would turn one typo in a
        # client's options into the silent, permanent loss of every request that client
        # makes. Undecodable content arrives as one of the three entries below instead.
        - EOFException
        - CharConversionException
        - MalformedInputException
        - UnmappableCharacterException
        # Apache Tika
        #
        # The generic TikaException is deliberately NOT listed: CompositeParser rethrows
        # every parser exception as one, so matching it would turn a disk-full or socket
        # error into a terminal 422. Its content subclasses therefore have to be named
        # individually.
        - EncryptedDocumentException
        - UnsupportedFormatException
        - ZeroByteFileException
        - CorruptedFileException
        # the document's own permissions forbid extraction, so no number of retries will
        # ever read it
        - AccessPermissionException
        # Apache PDFBox
        - InvalidPasswordException
        # Apache POI
        #
        # The specific types POI throws are usually subclasses of these and are matched
        # through the superclass walk in the classifier, so they do not need listing
        # individually.
        - EmptyFileException
        - OldFileFormatException
        - UnsupportedFileFormatException
        - NotOfficeXmlFileException
        - OfficeXmlFileException
        - NotOLE2FileException
        - RecordFormatException
        - InvalidFormatException
        # these three have no listed ancestor: they extend IllegalStateException,
        # RuntimeException and IOException respectively
        - CorruptPowerPointFileException
        - XSSFBParseException
        - InvalidZipException
        # XML content that is not well formed
        - SAXParseException
        # Apache Commons Imaging
        #
        # ImageReadException was renamed ImagingException in 1.0.0-alpha6; it is kept for
        # engines still pinning an earlier release. ImagingFormatException needs naming
        # because it extends ImagingRuntimeException, not ImagingException.
        - ImageReadException
        - ImagingException
        - ImagingFormatException

      # Fragments that identify a content failure reported only as a plain IOException.
      #
      # PDFBox signals most structural damage this way ("Missing root object specification
      # in trailer"). Matching on the message is unpleasant, but treating every IOException
      # as a content failure would hide real disk and network faults.
      #
      # Compared case insensitively, and only consulted for the types in
      # message-fragment-class-names below.
      message-fragments:
        - missing root object specification
        - expected='startxref'
        - expected 'startxref'
        - 'error: end-of-file'
        - unexpected end of file
        - premature end of file
        - not a pdf
        - invalid pdf
        - corrupt
        - damaged
        - malformed
        - truncated
        - is encrypted
        - password-protected
        - unsupported file format
        - unknown file format
        - cannot be parsed
        - could not be parsed

      # Types whose message is worth reading for a content failure.
      #
      # Several fragments above - corrupt, damaged, malformed, truncated - are words an
      # engine might use about itself, so scanning the message of *every* throwable would
      # turn an engine bug such as IllegalStateException("corrupt temporary output") into a
      # 422. Confining the scan to the types that actually report content damage in their
      # text closes that off.
      #
      # PDFBox and the JDK report structural damage as a plain IOException; XML arrives as a
      # SAXException; TikaException is Tika's wrapper, safe to read only because the
      # infrastructure veto has already examined the whole chain. A type that announces a
      # content failure by its own name belongs in class-names above instead.
      #
      # Deliberately NOT applied to infrastructure-message-fragments: the veto must stay
      # broad.
      message-fragment-class-names:
        - IOException
        - SAXException
        - TikaException

      # Class names that always mean the engine or its environment failed, never the
      # document.
      #
      # Checked across the whole cause chain *before* any content match, because libraries
      # wrap: without this, an outer wrapper that looks like a content failure would mask an
      # infrastructural cause and permanently drop a transform a retry would have fixed.
      infrastructure-class-names:
        # java.net - the engine could not reach something it needed
        - SocketException
        - SocketTimeoutException
        - ConnectException
        - UnknownHostException
        - NoRouteToHostException
        # interruption and timeout - shutdown or an overloaded engine, not the document
        - InterruptedIOException
        - ClosedByInterruptException
        - InterruptedException
        - TimeoutException
        # java.nio.file - the environment, not the content
        - FileSystemException
        - AccessDeniedException
        - NoSuchFileException
        # the engine itself is in trouble
        - OutOfMemoryError
        - StackOverflowError

      # Message fragments that identify an infrastructure failure reported as a plain
      # IOException, which is how the JDK reports most of them. Compared case insensitively.
      infrastructure-message-fragments:
        - no space left on device
        - disk quota exceeded
        - too many open files
        - connection reset
        - connection refused
        - broken pipe
        - read-only file system
        - cannot allocate memory
        - cannot run program
        - 'error=2, no such file or directory'
        - permission denied
