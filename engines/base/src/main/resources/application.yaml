---
spring:
  servlet:
    multipart:
      max-file-size: 8192MB
      max-request-size: 8192MB
  activemq:
    broker-url: ${ACTIVEMQ_URL:nio://localhost:61616}${ACTIVEMQ_URL_PARAMS:?jms.watchTopicAdvisories=false}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    pool:
      enabled: true
      max-connections: 20
  jackson:
    default-property-inclusion: non_empty

activemq:
  url: ${ACTIVEMQ_URL:false}
  url.params: ${ACTIVEMQ_URL_PARAMS:false}

server:
  port: ${SERVER_PORT:8090}
  error:
    include-message: ALWAYS
  tomcat:
    max-part-count: 10000
    max-part-header-size: 8192B

# Historic values (AVOID) - Exist to help with transition to newer versions
transformer-routes-path: ${TRANSFORMER_ROUTES_FILE_LOCATION:transformer-pipelines.json}

logging:
  level:
    org.alfresco.transform.common.TransformerDebug: debug

filestore-url: ${FILE_STORE_URL:http://localhost:8099/alfresco/api/-default-/private/sfs/versions/1/file}

transform:
  # How an exception from a CustomTransformer is turned into an HTTP status. A recognised
  # content failure becomes 422 so the T-Router stops retrying a document that can never
  # succeed; everything else stays 500 and is still retried.
  #
  # Defaults are shipped in transform-failure-classification-defaults.yaml, so omitting this
  # block is safe. Setting a list REPLACES them. To ADD to them instead, which is what an
  # engine, extension or deployment that knows one more exception usually wants, put the
  # entries under contributions.<name>.<list> with a name of your own:
  #
  #   contributions:
  #     site:
  #       class-names: [MyParserException]
  #
  # Each name is kept separately, so an engine's packaged contribution (t-aspose ships
  # "aspose") and a deployment's own are both applied wherever each comes from. Setting an
  # engine's name overrules that engine's lists, and an empty list removes them. A list and a
  # contribution may be set together. Names should be lower case letters and digits only, so
  # they can also be set from environment variables, for example
  # TRANSFORM_FAILURE_CLASSIFICATION_CONTRIBUTIONS_SITE_CLASSNAMES=MyParserException.
  # Variables split on commas, so an entry containing one needs the indexed form
  # (..._CLASSNAMES_0_=...) or SPRING_APPLICATION_JSON. Blank entries are ignored.
  #
  # The defaults file uses these same keys, so copying it out of the jar, editing it and
  # mounting it with SPRING_CONFIG_ADDITIONAL_LOCATION replaces the defaults at runtime -
  # including removing a single entry. The effective lists are logged at startup, each
  # decision at DEBUG, and anything unrecognised at INFO so the defaults can be corrected
  # from real deployments.
  #
  # infrastructure-class-names and infrastructure-message-fragments are a safety veto: a
  # match anywhere in the cause chain forces 500 even if a content rule matched, so a
  # library wrapper cannot hide a disk, network or interrupt failure. message-fragments are
  # read only from the types in message-fragment-class-names, so words such as "corrupt" in
  # an engine's own exception are not mistaken for a statement about the document; the veto
  # is deliberately not restricted this way.
  failure:
    classification:
      enabled: ${TRANSFORM_FAILURE_CLASSIFICATION_ENABLED:true}
  endpoint:
    test:
      enable: ${TEST_ENDPOINT_ENABLED:false}
  core:
    version: @project.version@
  engine:
    config:
      cron: 0 0 * * * *  # once an hour on the hour
      retry:
        attempts: 10
        timeout: 10 # seconds

jms-listener:
  concurrency: ${JMS_LISTENER_CONCURRENCY:1-10}

management:
  endpoints:
    web:
      exposure:
        include:
          - metrics
          - prometheus
          - health
          - transforms
  metrics:
    enable[http]: false
    enable[logback]: false
    enable[tomcat]: false
    enable[jvm.classes]: false

container:
  name: ${HOSTNAME:t-engine}
  isTRouter: false
  behind-ingres: false
