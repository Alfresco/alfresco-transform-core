---
spring:
  servlet:
    multipart:
      max-file-size: 8192MB
      max-request-size: 8192MB
  activemq:
    broker-url: ${ACTIVEMQ_URL:nio://localhost:61616}${ACTIVEMQ_URL_PARAMS:?jms.watchTopicAdvisories=false}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
    pool:
      enabled: true
      max-connections: 20
  jackson:
    default-property-inclusion: non_empty

activemq:
  url: ${ACTIVEMQ_URL:false}
  url.params: ${ACTIVEMQ_URL_PARAMS:false}

server:
  port: ${SERVER_PORT:8090}
  error:
    include-message: ALWAYS
  tomcat:
    max-part-count: 10000
    max-part-header-size: 8192B

# Historic values (AVOID) - Exist to help with transition to newer versions
transformer-routes-path: ${TRANSFORMER_ROUTES_FILE_LOCATION:transformer-pipelines.json}

logging:
  level:
    org.alfresco.transform.common.TransformerDebug: debug

filestore-url: ${FILE_STORE_URL:http://localhost:8099/alfresco/api/-default-/private/sfs/versions/1/file}

transform:
  # How an exception from a CustomTransformer is turned into an HTTP status. A recognised
  # content failure becomes 422 so the T-Router stops retrying a document that can never
  # succeed; everything else stays 500 and is still retried.
  #
  # Defaults live in TransformExceptionClassifier, so omitting this block is safe. Setting
  # a list REPLACES the defaults; the matching additional-* property extends them instead,
  # which is what an engine or extension that knows only its own libraries wants. Both may
  # be set together. The effective lists are logged at startup, each decision at DEBUG, and
  # anything unrecognised at INFO so the defaults can be corrected from real deployments.
  #
  # infrastructure-class-names and infrastructure-message-fragments are a safety veto: a
  # match anywhere in the cause chain forces 500 even if a content rule matched, so a
  # library wrapper cannot hide a disk, network or interrupt failure. message-fragments are
  # read only from the types in message-fragment-class-names, so words such as "corrupt" in
  # an engine's own exception are not mistaken for a statement about the document; the veto
  # is deliberately not restricted this way.
  failure:
    classification:
      enabled: ${TRANSFORM_FAILURE_CLASSIFICATION_ENABLED:true}
  endpoint:
    test:
      enable: ${TEST_ENDPOINT_ENABLED:false}
  core:
    version: @project.version@
  engine:
    config:
      cron: 0 0 * * * *  # once an hour on the hour
      retry:
        attempts: 10
        timeout: 10 # seconds

jms-listener:
  concurrency: ${JMS_LISTENER_CONCURRENCY:1-10}

management:
  endpoints:
    web:
      exposure:
        include:
          - metrics
          - prometheus
          - health
          - transforms
  metrics:
    enable[http]: false
    enable[logback]: false
    enable[tomcat]: false
    enable[jvm.classes]: false

container:
  name: ${HOSTNAME:t-engine}
  isTRouter: false
  behind-ingres: false
