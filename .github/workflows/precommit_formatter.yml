name: Pre-Commit formatter

on:
  push:
    branches:
      - precommit/**

permissions:
  contents: read

jobs:
  format-code:
    name: "Reformat code"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: contains(github.event.head_commit.message, '[reformat code]')
    steps:
      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@148e8c308239d720af80dc33c6cc3cf897764610 # v19.9.0
        with:
          auto-commit: "true"
