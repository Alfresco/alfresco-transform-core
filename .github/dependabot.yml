# Documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github_actions"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"
      - "java"
    cooldown:
      default-days: 7
    groups:
      maven:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      # Each T-Engine ships its own Dockerfile; the glob collapses the siblings.
      - "engines/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
